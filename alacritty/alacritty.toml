[[keyboard.bindings]]
key = "C"
mods = "Control"
action = "Copy"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
chars = "\u0003"

[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"

[window]
opacity = 0.76
blur = true
padding = { x = 12, y = 28 }
decorations = "transparent"

[terminal.shell]
program = "/bin/zsh"
args = ["-l"]

[font]
normal = { family = "MesloLGS NF", style = "Regular" }
size = 13.0

[colors.primary]
background = "#001a22"
foreground = "#839496"

[colors.normal]
black   = "#073642"
red     = "#dc322f"
green   = "#859900"
yellow  = "#b58900"
blue    = "#268bd2"
magenta = "#d33682"
cyan    = "#2aa198"
white   = "#eee8d5"

[colors.bright]
black   = "#002b36"
red     = "#cb4b16"
green   = "#586e75"
yellow  = "#657b83"
blue    = "#839496"
magenta = "#6c71c4"
cyan    = "#93a1a1"
white   = "#fdf6e3"
